<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101017">
  <title>SenceLab 2.2.7</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101017; --panel: #1b1a26; --border: #342e45;
      --text: #f6f1ff; --muted: #b8afc8; --lilac: #d9bfff; --mint: #9fe5ca; --pink: #ffb8cf;
      font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8eef4; --panel: #fffdfd; --border: #e8deec;
      --text: #21172b; --muted: #62546c; --lilac: #6846a0; --mint: #237458; --pink: #a7426a;
    }
    * { box-sizing: border-box; }
    :root { --amber: #f6d078; }
    :root[data-theme="light"] { --amber: #916111; }
    body { margin: 0; min-width: 290px; color: var(--text); background: radial-gradient(ellipse at 50% 18%, #272039, #0a090f 72%); }
    [data-theme="light"] body { background: radial-gradient(ellipse at 50% 18%, #eee4fa, #e5ddf0 72%); }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    .app { max-width: 480px; min-height: 100dvh; display: flex; flex-direction: column; margin: 0 auto; background: var(--bg); box-shadow: 0 0 90px #07060c; }
    header { display: flex; align-items: center; gap: 11px; padding: max(14px, env(safe-area-inset-top)) 20px 12px; min-height: 69px; }
    .brand { font-size: 23px; font-weight: 850; letter-spacing: -.75px; flex: 1; }
    .brand small { display: block; font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: 0; }
    .greeting { margin: 0 0 16px; }
    .greeting p { margin: 0 0 5px; color: var(--muted); font-weight: 650; }
    .greeting h1 { font-size: clamp(25px, 7vw, 34px); }
    main { flex: 1; padding: 10px 20px 24px; }
    h1 { margin: 0; font-size: clamp(27px, 8vw, 38px); line-height: 1.13; letter-spacing: -.045em; font-weight: 820; }
    .intro { margin: 8px 0 17px; color: var(--muted); }
    h2 { margin: 19px 0 9px; font-size: 17px; font-weight: 750; }
    .cover { position: relative; display: flex; align-items: end; min-height: 230px; border: 1px solid var(--border); border-radius: 26px; overflow: hidden;
      background: linear-gradient(105deg, #271936, #382750); }
    .cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover:has(> img)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #130d21f5, transparent 82%); }
    .cover-content { position: relative; z-index: 1; overflow-wrap: anywhere; }
    .cover-content { padding: 19px; }
    .cover h2, .cover p { color: #f6f1ff; }
    .cover .eyebrow { color: #d9bfff; }
    .eyebrow { font-size: 10px; letter-spacing: .2em; font-weight: 800; color: var(--lilac); }
    .cover h2 { font-size: 34px; margin: 4px 0 0; font-weight: 850; letter-spacing: -.045em; }
    .primary, .secondary { border-radius: 99px; min-height: 42px; padding: 8px 17px; font-size: 13px; font-weight: 780; }
    .primary { background: var(--lilac); color: var(--bg); border: 1px solid transparent; }
    .secondary { background: transparent; border: 1px solid var(--border); }
    .full { display: block; width: 100%; margin-top: 11px; }
    .restore-button { --restore-red: #ff9da7; color: var(--restore-red); border-color: var(--restore-red); }
    [data-theme="light"] .restore-button { --restore-red: #ac233b; }
    .restore-button:not(:disabled) { background: color-mix(in srgb, var(--restore-red) 12%, transparent); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; }
    .symbol, .icon-button { border: 0; border-radius: 50%; display: inline-grid; place-items: center; color: var(--accent, var(--lilac)); background: color-mix(in srgb, var(--accent, var(--lilac)) 13%, transparent); width: 40px; height: 40px; flex: none; }
    .icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .card { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 9px; text-align: left; }
    .card strong, .card small { display: block; overflow-wrap: anywhere; }
    .card small { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .card .arrow { margin-left: auto; color: var(--accent, var(--lilac)); flex: none; }
    .card[aria-pressed="true"] { border-color: var(--lilac); }
    [data-theme="light"] .memory-methods .card { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
    .memory-method { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
    .memory-method .icon-button { margin-bottom: 9px; justify-self: center; }
    .memory-help-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .memory-help-heading h2 { margin: 0; }
    .memory-help-copy { color: var(--muted); }
    .adb-steps { padding-left: 22px; color: var(--muted); }
    .adb-status { padding: 11px; border: 1px solid var(--border); border-radius: 12px; }
    .guide-list { display: grid; gap: 10px; margin-top: 16px; }
    .guide-card { display: grid; grid-template-columns: minmax(60px, 27%) minmax(0, 1fr) 34px; gap: 10px; align-items: center; padding: 9px; margin: 0; }
    .guide-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; }
    .guide-card .symbol { width: 34px; height: 34px; }
    .hot-list { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(124px, 39%); gap: 10px; overflow-x: auto; padding: 4px 0 10px; scroll-snap-type: x proximity; scrollbar-width: none; }
    .hot-list::-webkit-scrollbar { display: none; }
    .hot-list .pack-tile { margin: 0; scroll-snap-align: start; }
    .hot-list .pack-tile strong { padding-bottom: 0; }
    .hot-list .pack-tile small { padding: 0 12px 9px; }
    .hot-list .pack-tile:focus-visible { outline-offset: -3px; }
    .support-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; }
    .support-row + .support-row { border-top: 1px solid var(--border); }
    .support-row small { display: block; color: var(--muted); }
    .support-row button { flex: none; padding-inline: 11px; }
    button.card:hover, .secondary:hover, .icon-button:hover { border-color: var(--lilac); filter: brightness(1.15); }
    nav { position: sticky; bottom: 0; z-index: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--border); padding: 4px 5px max(5px, env(safe-area-inset-bottom)); background: var(--panel); }
    nav[hidden] { display: none; }
    nav button { min-height: 58px; border: 0; background: none; color: var(--muted); font-size: 11px; display: grid; place-items: center; align-content: center; gap: 3px; padding: 4px 0; }
    nav button span:first-child { width: 51px; height: 28px; border-radius: 99px; display: grid; place-items: center; }
    nav button span:last-child { min-height: 25px; display: grid; place-items: start center; padding: 0 2px; line-height: 1.15; }
    nav button[aria-current="page"] { color: var(--text); font-weight: 750; }
    nav button[aria-current="page"] span:first-child { color: var(--bg); background: var(--lilac); }
    .search { width: 100%; min-height: 46px; padding: 10px 13px; color: var(--text); border: 1px solid var(--border); background: var(--panel); border-radius: 15px; }
    .pack-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .pack-tile { display: block; overflow: hidden; padding: 0; text-align: left; }
    .pack-tile img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; }
    .pack-tile strong { padding: 9px 12px; display: block; }
    .pack-grid > p { grid-column: 1 / -1; }
    .upload { text-align: center; display: block; padding: 24px 17px; }
    .upload .symbol { width: 60px; height: 60px; }
    .upload .icon { width: 25px; height: 25px; }
    .upload p { overflow-wrap: anywhere; }
    .import-history { list-style: none; margin: 0; padding: 0; }
    .import-history li { padding: 10px 12px; overflow-wrap: anywhere; }
    .import-history li span { flex: 1; min-width: 0; }
    .import-history button { flex: none; color: var(--pink); }
    .muted { color: var(--muted); }
    dialog { width: min(400px, calc(100% - 34px)); max-height: 88dvh; border: 1px solid var(--border); border-radius: 24px; background: var(--panel); color: var(--text); padding: 19px; }
    dialog::backdrop { background: #09070cd6; }
    dialog h2 { margin: 6px 0 9px; font-size: 25px; overflow-wrap: anywhere; }
    dialog p { margin: 7px 0; }
    dialog img { width: 100%; max-height: 47dvh; object-fit: contain; border-radius: 13px; display: block; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; flex-wrap: wrap; }
    .pass-label { display: block; font-weight: 750; margin: 12px 0 5px; }
    .pass-error { color: var(--pink); font-size: 13px; }
    [data-theme="light"] .app {
      background: radial-gradient(ellipse at 4% 0%, #ddd4ff, transparent 62%),
        radial-gradient(ellipse at 100% 14%, #ffdbe9, transparent 59%),
        radial-gradient(ellipse at 100% 100%, #edf7d5, transparent 60%),
        linear-gradient(160deg, #ffecdf, #eee5ff);
    }
    [data-theme="light"] .primary { background: #7860b5; color: #ffffff; }
    [data-theme="light"] nav { background: #fffcff; border-color: #e2d6eb; }
    [data-theme="light"] nav button { color: #62546c; }
    [data-theme="light"] nav button[aria-current="page"] { color: #5c448e; }
    [data-theme="light"] nav button[aria-current="page"] span:first-child { color: #ffffff; background: #7860b5; }
    [data-theme="light"] .app-profile::before { background: linear-gradient(100deg, #dbd2ff, #f9dcea); }
    .feedback { color: var(--mint); margin-top: 12px; }
    .app-profile, .settings-group { border: 1px solid var(--border); border-radius: 22px; background: var(--panel); margin-bottom: 13px; }
    .app-profile { position: relative; overflow: hidden; padding: 22px 14px 16px; text-align: center; }
    .app-profile::before { content: ""; position: absolute; inset: 0 0 auto; height: 65px; background: linear-gradient(105deg, #38274f, #614175); }
    .app-profile .symbol { position: relative; width: 62px; height: 62px; color: #d9bfff; background: #211b31; box-shadow: 0 0 0 4px var(--panel); }
    .app-profile .icon { width: 29px; height: 29px; }
    .app-profile .admin-trigger { color: #ffd477; background: #332443; }
    .app-profile h2 { margin: 8px 0 2px; font-size: 24px; letter-spacing: -.03em; }
    .app-profile p { margin: 0; color: var(--muted); font-size: 12px; }
    .settings-group { padding: 12px 13px 3px; }
    .settings-group h2 { margin: 0 0 2px; color: var(--muted); font-size: 13px; }
    .settings-group .card { border: 0; border-radius: 0; padding: 10px 0; margin: 0; }
    .settings-group .card + .card { border-top: 1px solid var(--border); }
    .settings-group .card > span:nth-child(2) { flex: 1; min-width: 0; }
    .settings-group button.card:hover { filter: none; color: var(--lilac); }
    @keyframes content-enter {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dialog-enter {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdrop-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    main:not([data-page="settings"]) > :first-child { animation: content-enter 150ms ease-out; }
    dialog[open] { animation: dialog-enter 190ms ease-out; }
    dialog[open]::backdrop { animation: backdrop-enter 160ms ease-out; }
    button, nav button span:first-child {
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }
    .pack-tile img, .guide-card img { transition: filter 180ms ease; }
    @media (hover: hover) {
      button.card:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 14px #18102022; }
      .pack-tile:hover img, .guide-card:hover img { filter: saturate(1.12) brightness(1.06); }
    }
    button:not(:disabled):active { transform: scale(.97); }
    @media (prefers-reduced-motion: reduce) {
      main:not([data-page="settings"]) > :first-child, dialog[open], dialog[open]::backdrop { animation: none; }
      button, nav button span:first-child, .pack-tile img, .guide-card img { transition: none; }
      button.card:not(:disabled):hover, button:not(:disabled):active { transform: none; }
    }
      /* SenceLab 1.5 */
    :root {
      --fx-glow: #b389ff45; --fx-edge: #c3a0fa73;
      --fx-tint: #a56bf519; --fx-sheen: #e3c3ff24; --fx-glass: #211a30e8;
      --fx-badge: linear-gradient(140deg, #382658, #211a30 63%, #442344);
    }
    :root[data-theme="light"] {
      --fx-glow: #8452be36; --fx-edge: #a680cd84;
      --fx-tint: #bd8aee17; --fx-sheen: #fff8ffe0; --fx-glass: #fffbfff0;
      --fx-badge: linear-gradient(145deg, #fff4fb, #eadbff 62%, #f5dbea);
    }
    header > .symbol, header > .icon-button {
      background: var(--fx-badge);
      box-shadow: inset 0 1px 0 var(--fx-sheen), 0 3px 12px var(--fx-glow);
    }
    .card, .settings-group, .app-profile {
      background-image: linear-gradient(145deg, var(--fx-tint), transparent 58%);
      box-shadow: inset 0 1px 0 var(--fx-sheen);
    }
    dialog {
      background: linear-gradient(145deg, var(--fx-tint), transparent 68%), var(--fx-glass);
      box-shadow: inset 0 1px 0 var(--fx-sheen), 0 16px 38px #160d273d, 0 0 18px var(--fx-glow);
    }
    .primary {
      background-image: linear-gradient(115deg, var(--fx-sheen), transparent 60%);
      box-shadow: inset 0 1px 0 var(--fx-sheen), 0 3px 12px var(--fx-glow);
    }
    nav button[aria-current="page"] span:first-child {
      box-shadow: inset 0 1px 0 #ffffff6b, 0 2px 10px var(--fx-glow);
    }
    .search:focus-visible { box-shadow: 0 0 0 4px var(--fx-glow); }
    .cover-content { isolation: isolate; }
    .cover-content::after {
      content: ""; position: absolute; inset: 0 0 auto; height: 2px;
      background: linear-gradient(90deg, transparent, var(--fx-sheen), var(--fx-edge), transparent);
      opacity: 0; pointer-events: none;
    }
    @keyframes sl11-sweep {
      from { transform: translateX(-55%); opacity: 0; }
      45% { opacity: .9; }
      to { transform: translateX(55%); opacity: 0; }
    }
    @keyframes sl11-tab {
      from { opacity: .72; transform: scale(.89); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (hover: hover) {
      button.card:not(:disabled):hover, .primary:not(:disabled):hover {
        border-color: var(--fx-edge);
        box-shadow: 0 5px 15px var(--fx-glow);
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      nav button[aria-current="page"] span:first-child { animation: sl11-tab 190ms ease-out; }
    }
    /* Blur is limited to fine-pointer displays and one open layer. */
    [data-action] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .permission-detail { display: grid; gap: 5px; margin: 8px 0 0; }
    .permission-detail div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
    .permission-detail dt { font-weight: 750; }
    .permission-detail dd { margin: 0; color: var(--muted); }
    .permission-detail .ready { color: var(--mint); font-weight: 750; }
    @keyframes badge-in {
      from { opacity: .55; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: no-preference) {
      header .brand-mark { animation: badge-in 230ms ease-out; }
      main[data-page="home"] .cover, main[data-page="permissions"] > .card:first-of-type {
        animation: content-enter 210ms 45ms ease-out both;
      }
    }
    html, body { overscroll-behavior: none; }
    .hot-list { overscroll-behavior-x: none; }
    @media (hover: none) {
      button { transition: transform 110ms ease, background-color 110ms ease; }
    }
    main[data-page="settings"] button.card:not(:disabled):is(:hover, :active) {
      transform: none;
      box-shadow: var(--settings-row-shadow, inset 0 1px 0 var(--fx-sheen));
    }
    :root[data-theme="dark"] .settings-group h2 + .card {
      --settings-row-shadow: none;
      box-shadow: var(--settings-row-shadow);
    }
    header > .brand-mark { overflow: hidden; background: #000; }
    .brand-mark img { display: block; width: 86%; height: 86%; min-width: 0; min-height: 0; object-fit: cover; object-position: 50% 46%; }
      @media (prefers-reduced-motion: no-preference) {
      main:not([data-page="settings"]) > * { animation: content-enter 180ms ease-out both; }
      main:not([data-page="settings"]) > :nth-child(2) { animation-delay: 20ms; }
      main:not([data-page="settings"]) > :nth-child(3) { animation-delay: 35ms; }
      button { transition: transform 120ms ease-out, background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
      button:active { transform: scale(.98); }
      dialog[open] { animation: dialog-enter 180ms ease-out; }
    }
    progress { accent-color: var(--mint); border-radius: 8px; height: 8px; }
    .permission-summary { padding: 23px; min-height: 185px; margin: 18px 0; background: linear-gradient(120deg, var(--panel), color-mix(in srgb, var(--lilac) 16%, var(--panel))); }
    .permission-summary h2 { font-size: 24px; margin: 12px 0; }
    .permission-summary .permission-detail { font-size: 14px; gap: 10px; }
    @media (prefers-reduced-motion: no-preference) {
      .permission-summary { animation: content-enter 220ms ease-out both; }
      .memory-method { animation: content-enter 180ms ease-out both; }
      .search { transition: border-color 160ms ease, box-shadow 160ms ease; }
    }
    .permission-status { min-height: 95px; padding: 24px; display: flex; align-items: center; gap: 13px; margin: 12px 0; font-size: 17px; }
    .status-dot { width: 13px; height: 13px; border-radius: 50%; flex: none; background: #c34b60; }
    .status-dot.green { background: #2eaa7a; box-shadow: 0 0 0 5px #2eaa7a18; }
    .status-dot.yellow { background: #d5a12e; box-shadow: 0 0 0 5px #d5a12e18; }
    .status-dot.red { box-shadow: 0 0 0 5px #c34b6018; }
    .memory-help-copy { overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
    dialog { overflow-x: hidden; }
    .reset-link { position: absolute; z-index: 2; right: 15px; top: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; color: var(--muted); font-size: 12px; }
    .support-row small b { color: var(--text); font-weight: 800; }
    .cover::before { content: ''; pointer-events: none; position: absolute; z-index: 2; inset: -90% -40%; background: linear-gradient(115deg, transparent 42%, #ffffff20 48%, #ffffff35 50%, transparent 57%); transform: translateX(-75%); }
    @media (prefers-reduced-motion: no-preference) {
      .cover::before { animation: cover-sheen 8s ease-in-out infinite; }
      @keyframes cover-sheen { 0%, 65% { transform: translateX(-75%); } 90%, 100% { transform: translateX(75%); } }
    }
    .permission-status { flex-wrap: wrap; }
    .permission-status > strong { flex: 1; min-width: 0; }
    .permission-status > button { flex-basis: 100%; }
    @media (prefers-reduced-motion: no-preference) {
      .status-dot { animation: status-pulse 2.8s ease-in-out infinite; }
      .status-dot.yellow { animation-duration: 1.9s; }
      .status-dot.red { animation-duration: 3.5s; }
      @keyframes status-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .58; transform: scale(.85); } }
    }
    .support-row button { flex: 0 0 100px; width: 100px; min-height: 42px; white-space: nowrap; }
    .support-row > div { min-width: 0; overflow-wrap: anywhere; }
    main[data-page="access"] > *, main[data-page="permissions"] > *, .memory-method { animation: none !important; }

    .import-kind-tabs { display:flex; gap:10px; margin:20px 0; }
    .import-kind { flex:1; padding:13px 6px; border-radius:17px; font-weight:700; border:1px solid var(--border); background:var(--panel); color:var(--text); transition:background .18s,box-shadow .18s; }
    .import-kind.kind-0 { color:#8060bc; background:color-mix(in srgb,var(--lilac) 23%,var(--panel)); }
    .import-kind.kind-1 { color:#267b65; background:color-mix(in srgb,var(--mint) 28%,var(--panel)); }
    .import-kind.kind-2 { color:#a94572; background:color-mix(in srgb,var(--pink) 28%,var(--panel)); }
    .import-kind.selected { box-shadow:inset 0 0 0 2px currentColor; }
    .import-picker { padding:24px; text-align:center; }
    .import-picker .symbol { margin:auto; }
    .import-picker h2 { margin:12px 0 4px; }
    .import-picker p { margin:0 0 20px; }
    .import-demo-list { padding:0; list-style:none; display:grid; gap:14px; }
    .import-demo-list li { margin:0; padding:16px; display:flex; align-items:center; gap:12px; border-radius:25px; }
    .import-demo-info { flex:1; min-width:0; }
    .import-demo-info strong { display:block; font-size:16px; font-weight:550; overflow-wrap:anywhere; }
    .import-demo-info small { display:block; color:var(--muted); margin-top:7px; font-size:13px; }
    .import-demo-actions { display:flex; gap:10px; flex:none; }

    .import-tools { display:flex; align-items:center; gap:9px; margin:22px 0 28px; }
    .import-tools > button, .import-route { border-radius:999px; min-height:48px; background:#7b60b5; color:#fff; border:1px solid rgba(255,255,255,.38); box-shadow:inset 0 2px 0 rgba(255,255,255,.26),0 4px 14px rgba(100,67,155,.18); font:inherit; font-size:14px; font-weight:600; }
    .import-tools > button { flex:0 0 auto; padding:11px 17px; }

        row("Hướng dẫn cấp quyền", "Xem các bước thiết lập", "info", "pink", "guide") +

      access: () => title("Cấp quyền bộ nhớ", "Chọn cách cấp quyền để SenceLab ghi file vào trò chơi.") +
        '<div class="memory-methods">' + memoryMethods.map(([name, detail, glyph, color], index) =>
          '<div class="memory-method">' +
          row(name, detail, glyph, color, "memory-" + index, app.mode === name) +
          '<button class="icon-button" style="--accent:var(--' + color + ')" aria-label="Hướng dẫn ' + name +
          '" data-action="help-memory-' + index + '">' + icon("alert") + '</button></div>').join("") + '</div>' +
        '<p class="muted" role="status">' + escapeText(memoryStatus) + '</p>',
      settings: () => '<div class="settings-title"><h1>Cài đặt chung</h1><button class="icon-button support-qr-button" data-action="support-qr" aria-label="Mã QR" title="Mã QR">' + icon('qr') + '</button></div>' +
        '<section class="app-profile"><button class="symbol admin-trigger" data-action="admin" aria-label="Admin Login">' +
        icon("crown") + '</button><h2>SenceLab</h2><p>' + (app.admin ? 'Admin đã đăng nhập · ' : '') + 'Phiên bản 2.2.7</p></section>' +
        group("Chung", row("Chủ đề", app.dark ? "Tối" : "Sáng", "moon", "lilac", "theme")) +
        group("Tiện ích", row("Tính năng chưa ra mắt", "Đang phát triển", "info", "lilac")) +
        group("Hệ thống & hỗ trợ",
          supportRow("Phiên bản ứng dụng", "v2.2.7 · SenceLab", "Kiểm tra", "version-check") +
          supportRow("Xóa bộ nhớ đệm (Cache)", "Ảnh và tệp tạm · <b>" + cacheLabel() + "</b>", "Xóa", "cache-confirm")) +
        group("Liên hệ", row("Telegram", "Trao đổi và hỗ trợ", "telegram", "mint", "community-telegram") +
          row("TikTok", "Video ngắn và cập nhật", "tiktok", "lilac", "community-tiktok") +
          row("YouTube", "Video hướng dẫn và cập nhật", "play", "pink", "community-youtube")) +
        button("Đặt lại", "reset-app", "secondary restore-button full"),
      guide: () => '<h1>Hướng dẫn</h1><div class="guide-list">' +
        guides.map(([name, summary, , image], index) =>
          '<button class="card guide-card" data-action="guide-item-' + index + '">' +
          '<img src="preview-assets/' + image + '.png" alt="" loading="lazy" decoding="async"><span><strong>' + name + '</strong><small>' +
          summary + '</small></span>' + symbol("play") + '</button>').join("") + '</div>'
    };

    function render() {
      const changedPage = screen.dataset.page !== app.page;
      screen.dataset.page = app.page;
      const root = document.documentElement;
      const theme = app.dark ? "dark" : "light";
      if (root.dataset.theme !== theme) {
        root.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = app.dark ? "#101017" : "#f8eef4";
        native.setTheme(app.dark);
      }
      const isTab = tabs.some(([page]) => page === app.page);
      const headerMode = isTab ? "tabs" : "back";
      if (header.dataset.mode !== headerMode) {
        header.dataset.mode = headerMode;
        header.innerHTML = (isTab ? '<span class="symbol brand-mark"><img src="preview-assets/sencelab-logo.png" alt=""></span>' : '<button class="icon-button" aria-label="Quay lại" data-action="back">' + icon("left") + '</button>') +
          '<span class="brand">SenceLab<small>Liên Quân Mobile</small></span>' + (isTab ? '<button class="icon-button" aria-label="Hướng dẫn" data-action="guide">' + icon("info") + '</button>' : "");
      }
      nav.hidden = !isTab;
      if (changedPage) {
        nav.querySelector('[aria-current="page"]')?.removeAttribute("aria-current");
        nav.querySelector('[data-action="tab-' + app.page + '"]')?.setAttribute("aria-current", "page");
      }
      screen.innerHTML = screens[app.page]() + (app.feedback ? '<p class="feedback" role="status">' + escapeText(app.feedback) + '</p>' : "");
    }

    function permissionDetails() {
      if (!memoryDetails) return '<p class="muted">' + escapeText(memoryStatus) + '</p>';
      return '<dl class="permission-detail">' +
        (memoryDetails.methods || []).map(method => [method.name, method.ready ? "Sẵn sàng" : method.connected ? "Đã kết nối, chưa ghi được" : "Chưa kết nối"])
          .map(([name, status]) => '<div><dt>' + name + '</dt><dd' + (status === "Sẵn sàng" ? ' class="ready"' : '') +
            '>' + escapeText(status) + '</dd></div>').join("") + '</dl>';
    }

    function homePermissions() {
      const activeMethod = memoryDetails?.activeMethod || memoryDetails?.selectedMethod;
      const showBankFix = memoryDetails?.statusColor === 'green' && ['Shizuku','ADB WiFi'].includes(activeMethod) &&
        (memoryDetails?.methods || []).some(method => method.name === activeMethod && method.ready);
      return permissionSummary(true) +
        (showBankFix ? button('Fix ngân hàng', 'debug-disable', 'primary full bank-fix-button') : '') +
        (memoryDetails?.canFix ? button("Fix", "fix-data", "secondary restore-button full") : "");
    }

    function permissionSummary(includePicker = false) {
      const color = memoryDetails?.statusColor || "red";
      return '<section class="card permission-status" role="status"><span class="status-dot ' + color +
        '"></span><strong>' + escapeText(memoryDetails?.summary || "Chưa có quyền bộ nhớ") + '</strong>' +
        (includePicker && color !== "green" ? button("Chọn quyền bộ nhớ", "access", "secondary full") : "") + '</section>';
    }

    function showPack(pack, fromHistory = false) {
      if (!pack) return;
      app.pending = { ...pack, fromHistory };
      dialog.innerHTML = '<h2 id="dialog-title">' + escapeText(pack.name) + '</h2>' +
        (pack.image ? '<img src="' + escapeText(pack.image) + '" alt="Ảnh xem trước ' + escapeText(pack.name) + '">' : "") +
        (pack.detail ? '<p>' + escapeText(pack.detail) + '</p>' : "") + (pack.image && pack.category !== "Mod skin" && !fromHistory
          ? '<label class="pass-label" for="map-pass">Pass</label><input class="search" id="map-pass" autocomplete="off" aria-describedby="pass-error"' +
            (app.admin ? (pack.bundleId ? ' type="text" placeholder="Đang đọc pass.txt…"' : ' type="text" value="0001" readonly') : ' type="password"') +
            '><p id="pass-error" class="pass-error" role="alert" hidden></p>'
          : '') + '<div class="dialog-actions">' + button("Đóng", "close", "secondary") +
        button("Áp dụng", "apply") + '</div>';
      dialog.showModal();
      if (!fromHistory && pack.category !== "Mod skin" && pack.bundleId && !pack.passId) {
        const error = dialog.querySelector("#pass-error");
        error.textContent = "Map này chưa có pass.txt công khai.";
        error.hidden = false;
        dialog.querySelector('[data-action="apply"]').disabled = true;
      } else if (!fromHistory && pack.bundleId && app.admin) native.mapPass(pack.passId);
    }

    function validMapPass() {
      const input = dialog.querySelector("#map-pass");
      if (!input || (app.pending?.bundleId ? input.value.trim() : input.value === "0001")) return true;
      const error = dialog.querySelector("#pass-error");
      error.textContent = input.value ? "Pass không đúng." : "Nhập pass để tiếp tục.";
      error.hidden = false;
      input.setAttribute("aria-invalid", "true");
      input.focus();
      return false;
    }

    dialog.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.id === "map-pass") {
        event.preventDefault();
        dialog.querySelector('[data-action="apply"]').click();
      }
    });

    dialog.addEventListener("submit", event => {
      if (event.target.id !== "admin-form") return;
      event.preventDefault();
      const fields = new FormData(event.target);
      if (!native.adminLogin(fields.get("username"), fields.get("password"))) {
        const error = dialog.querySelector("#admin-error");
        error.hidden = false;
        error.textContent = "Tài khoản hoặc mật khẩu không đúng.";
        return;
      }
      app.admin = true;
      dialog.close();
      render();
    });

    document.addEventListener("change", event => { if(event.target.id === "import-route") importRoute = event.target.value; });
    document.addEventListener("input", event => {
      if (event.target.id === "search") {
        app.query = event.target.value;
        if (queryFrame) return;
        queryFrame = requestAnimationFrame(() => {
          queryFrame = 0;
          const results = document.querySelector("#drive-results");
          if (results) results.innerHTML = driveCatalog();
        });
      }
    });

    function applyPack(pack) {
      if (applying) return;
      applying = true;
      app.pending = null;
      dialog.innerHTML = '<h2 id="dialog-title">Đang áp dụng…</h2><p>Đang kiểm tra và ghi tệp map.</p>' +
        '<progress aria-label="Đang áp dụng" style="width:100%"></progress>';
      if (!dialog.open) dialog.showModal();
      native.applyMap(JSON.stringify(pack));
    }

    document.addEventListener("click", event => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      if (action.startsWith("tab-")) return go(action.slice(4));
      if (action.startsWith('skin-entry-')) return showPack(skinEntries[Number(action.slice(11))]);
      if (action === 'skin-remove') {
        dialog.innerHTML='<h2 id="dialog-title">Xóa SkinChess?</h2><p>Khôi phục skin gốc và gỡ SkinChess? Map đang dùng vẫn được giữ lại.</p><div class="dialog-actions">' + button('Hủy','close','secondary') + button('Xóa skin','skin-remove-confirm','skin-remove') + '</div>';
        dialog.showModal(); return;
      }
      if (action === 'skin-remove-confirm') {
        dialog.innerHTML='<h2 id="dialog-title">Đang khôi phục skin gốc…</h2><p>Vui lòng chờ…</p><progress style="width:100%"></progress>';
        native.removeSkin(); return;
      }
      if (action === 'debug-disable') {
        notice('Ngắt kết nối & tắt gỡ lỗi?', 'SenceLab sẽ tắt các mục gỡ lỗi và ngắt kết nối hiện tại.', 'debug-disable-confirm'); return;
      }
      if (action === 'debug-disable-confirm') {
        dialog.innerHTML='<h2 id="dialog-title">Đang tắt gỡ lỗi…</h2><p>Vui lòng chờ trong giây lát.</p><progress style="width:100%"></progress>';
        native.disableDebugging(); return;
      }
      if (action === 'support-qr') {
        dialog.classList.add('qr-dialog');
        dialog.removeAttribute('aria-labelledby'); dialog.setAttribute('aria-label','Mã QR');
        dialog.innerHTML = '<div class="qr-window"><img src="preview-assets/support-qr-2.2.1.png" alt="Mã VietQR của TRINH TRUONG THANH, số tài khoản 0927027336"></div>';
        dialog.showModal(); return;
      }
      if (action === 'adb-notifications') { native.adbNotifications(); return; }
      if (action === 'catalog-history') return go('history', true);
      if (action.startsWith('history-pack-')) {
        const item = usedMaps[Number(action.slice(13))];
        if (item) showPack(driveEntries.find(entry => entry.id === item.id) || item, true);
        return;
      }
      if (action.startsWith("drive-entry-")) return showPack(driveEntries[Number(action.slice(12))]);
      if (action.startsWith("hot-pack-")) return showPack(hotPacks[Number(action.slice(9))]);
      if (action.startsWith("local-apply-")) return applyPack(app.bundles[Number(action.slice(12))]);
      if (action.startsWith('catalog-kind-')) { catalogKind = ['Map cờ','Mod skin'][Number(action.slice(13))]; app.query = ''; render(); return; }
      if (action.startsWith('import-demo-kind-')) { importKind = ['Map 5v5','Map cờ','Skin'][Number(action.slice(17))]; render(); return; }
      if (action === 'import-demo-choose-z') return;
      if (action === 'import-demo-pick') { native.chooseImport(importKind); return; }
      if (action.startsWith('import-demo-apply-')) {
        const file = app.bundles.find(file => file.localId === action.slice(18));
        if (file) { dialog.innerHTML='<h2 id="dialog-title">Đang áp dụng…</h2><p>Vui lòng chờ…</p><progress style="width:100%"></progress>'; dialog.showModal(); native.applyImport(file.localId, importRoute); }
        return;
      }
      if (action.startsWith('import-demo-delete-')) {
        const id = action.slice(19), file = app.bundles.find(file => file.localId === id); if (!file) return;
        dialog.innerHTML = '<h2 id="dialog-title">Xóa tệp đã nhập?</h2><p>Xóa “' + escapeText(file.name) + '” khỏi danh sách đã nhập?</p><div class="dialog-actions">' + button('Hủy','close','secondary') + button('Xóa','import-demo-confirm-' + id) + '</div>'; dialog.showModal(); return;
      }
      if (action.startsWith('import-demo-confirm-')) { native.deleteBundle(action.slice(20)); return; }
      if (action.startsWith("delete-bundle-")) return native.deleteBundle(app.bundles[Number(action.slice(14))].localId);
      if (action.startsWith("guide-item-")) {
        const [name, , detail] = guides[Number(action.slice(11))];
        dialog.innerHTML = '<h2 id="dialog-title">' + name + '</h2><p>' + detail + '</p>' +
          button("Đã hiểu", "close", "primary full");
        dialog.showModal();
        return;
      }
      if (action.startsWith("help-memory-")) {
        const [name, , , color, help] = memoryMethods[Number(action.slice(12))];
        dialog.innerHTML = '<div class="memory-help-heading">' + symbol("alert", color) +
          '<h2 id="dialog-title">' + escapeText(name) + '</h2></div><p class="memory-help-copy">' +
          escapeText(help) + '</p>' + button("Đã hiểu", "close", "primary full");
        if (name === "SAF V2") dialog.insertAdjacentHTML("beforeend", button("Chọn tệp bằng ZArchiver", "saf-zarchiver", "secondary full"));
        dialog.showModal();
        return;
      }
      if (action.startsWith("memory-")) {
        awaitingMemory = true;
        app.mode = memoryMethods[Number(action.slice(7))][0];
        render();
        screen.querySelector('[data-action="' + action + '"]').focus();
        if (app.mode === "ADB WiFi") showAdbPairing();
        native.requestMemory(app.mode);
        return;
      }

      switch (action) {
        case "saf-zarchiver":
          app.mode = "SAF V2";
          awaitingMemory = true;
          native.chooseZarchiver();
          break;
        case "reset-app": {
          native.beginReset();
          const readyAt = Date.now() + 5000;
          dialog.innerHTML = '<h2 id="dialog-title">Đặt lại ứng dụng?</h2><p>Xóa toàn bộ dữ liệu SenceLab, gồm tài khoản đã đăng nhập, tệp đã nhập, lịch sử, cài đặt và bản sao lưu trong app. Dữ liệu trò chơi đã thay sẽ vẫn ở trên máy. Ứng dụng sẽ đóng sau khi đặt lại.</p><div class="dialog-actions">' +
            button("Hủy", "close", "secondary") + button("Xóa tất cả (5s)", "reset-confirm", "secondary restore-button", true) + '</div>';
          if (!dialog.open) dialog.showModal();
          clearInterval(resetTimer);
          resetTimer = setInterval(() => {
            const confirm = dialog.querySelector('[data-action="reset-confirm"]');
            if (!confirm || !dialog.open) { clearInterval(resetTimer); return; }
            const seconds = Math.max(0, Math.ceil((readyAt - Date.now()) / 1000));
            confirm.textContent = seconds ? "Xóa tất cả (" + seconds + "s)" : "Xóa tất cả";
            confirm.disabled = seconds > 0;
            if (!seconds) clearInterval(resetTimer);
          }, 100);
          break;
        }
        case "reset-confirm": native.resetApp(); break;
        case "history-toggle": historyCollapsed = !historyCollapsed; render(); break;
        case "fix-data":
          notice("Đã kết nối nhưng chưa có quyền ghi?", "Làm mới tài nguyên để khắc phục lỗi áp dụng map. Hãy đóng trò chơi trước khi tiếp tục. Quá trình này có thể mất vài phút.", "fix-data-confirm");
          break;
        case "fix-folder": native.fixFolder(); break;
        case "fix-data-confirm":
          dialog.innerHTML = '<h2 id="dialog-title">Đang làm mới tài nguyên</h2><p>Vui lòng chờ…</p><progress aria-label="Tiến độ làm mới tài nguyên" style="width:100%"></progress>';
          if (!dialog.open) dialog.showModal();
          native.fixData();
          break;
        case "adb-settings": native.adbSettings(); break;
        case "adb-connect": native.adbConnect(); break;
        case "adb-notification-settings": native.adbNotificationSettings(); break;
        case "adb-pair": {
          const code = dialog.querySelector("#adb-code");
          const port = dialog.querySelector("#adb-port");
          native.adbPair(code.value.trim(), port.value.trim());
          break;
        }
        case "version-check":
          notice("Phiên bản ứng dụng", "Đang kiểm tra GitHub Releases…");
          native.checkVersion();
          break;
        case "cache-confirm":
          native.cacheSize();
          dialog.innerHTML = '<h2 id="dialog-title">Xóa bộ nhớ đệm?</h2><p>Xóa ảnh lưu đệm và tệp tạm của ứng dụng. Các tệp đã nhập và bản sao lưu vẫn được giữ.</p><div class="dialog-actions">' +
            button("Hủy", "close", "secondary") + button("Xóa Cache", "cache-clear") + '</div>';
          dialog.showModal();
          break;
        case "cache-clear":
          dialog.innerHTML = '<h2 id="dialog-title">Đang xóa bộ nhớ đệm…</h2><progress aria-label="Đang xóa bộ nhớ đệm"></progress>';
          native.clearCache();
          break;
        case "permission-check":
          dialog.dataset.awaiting = "permission";
          notice("Kiểm tra quyền", "Đang kiểm tra quyền ghi vào tệp map…");
          native.checkMemory();
          break;
        case "verify-map":
          dialog.dataset.awaiting = "map-state";
          notice("Kiểm tra tệp đang dùng", "Đang đọc và đối chiếu tệp map…");
          native.verifyInstalled();
          break;
        case "permission-reset":
          dialog.innerHTML = '<h2 id="dialog-title">Đặt lại tất cả quyền?</h2><p>Ngắt kết nối ADB, bỏ quyền SAF đã lưu và đặt lại truy cập Shizuku, LDPlayer trong SenceLab. Lần dùng tiếp theo cần chọn và cấp lại quyền. Các công tắc hệ thống được quản lý trong Cài đặt Android.</p><div class="dialog-actions">' + button("Hủy", "close", "secondary") + button("Đặt lại", "permissions-reset-confirm", "secondary restore-button") + '</div>';
          dialog.showModal();
          break;
        case "permissions-reset-confirm":
          native.resetPermissions();
          app.mode = "";
          awaitingMemory = false;
          notice("Đặt lại quyền", "Đang đặt lại quyền truy cập…");
          break;
        case "access": case "guide": go(action, true); break;
        case "back": back(); break;
        case "theme":
          dialog.innerHTML = '<h2 id="dialog-title">Chủ đề</h2><div class="dialog-actions">' +
            button("Sáng", "theme-light", app.dark ? "secondary" : "primary") +
            button("Tối", "theme-dark", app.dark ? "primary" : "secondary") + '</div>';
          dialog.showModal();
          break;
        case "theme-light": case "theme-dark":
          app.dark = action === "theme-dark";
          try { localStorage.setItem("skinlab.theme", app.dark ? "dark" : "light"); } catch {}
          dialog.close();
          render();
          screen.querySelector('[data-action="theme"]').focus();
          break;
        case "admin":
          dialog.innerHTML = '<h2 id="dialog-title">Admin Login</h2>' + (app.admin
            ? '<p>Đã đăng nhập Admin.</p><div class="dialog-actions">' + button("Hủy", "close", "secondary") + button("Đăng xuất", "admin-logout", "secondary") + button("Đặt lại", "reset-app", "secondary restore-button") + '</div>'
            : '<form id="admin-form">' +
              '<label class="pass-label" for="admin-user">Tài khoản</label><input class="search" id="admin-user" name="username" autocomplete="username" required>' +
              '<label class="pass-label" for="admin-password">Mật khẩu</label><input class="search" id="admin-password" name="password" type="password" autocomplete="current-password" required>' +
              '<p id="admin-error" class="pass-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Hủy</button><button type="submit" class="primary">Đăng nhập</button></div></form>');
          dialog.showModal();
          break;
        case "admin-logout":
          app.admin = false;
          native.adminLogout();
          dialog.close();
          render();
          break;
        case "drive-refresh": refreshDrive(); render(); break;
        case "release-download": native.openExternal(releaseUrl); break;
        case "community-youtube": case "community-tiktok": case "community-telegram":
          native.openExternal(contactLinks[action]);
          break;
        case "pick": native.chooseAssetBundle(); break;
        case "save-bundle": {
          const input = dialog.querySelector("#bundle-name");
          const name = input.value.trim();
          if (!name) {
            input.focus();
            break;
          }
          dialog.innerHTML = '<h2 id="dialog-title">Đang nhập tệp…</h2><progress aria-label="Đang nhập"></progress>';
          native.saveBundle(name);
          break;
        }
        case "apply":
          if (applying || !validMapPass()) break;
          applyPack({ ...app.pending, enteredPass: dialog.querySelector("#map-pass")?.value.trim() });
          break;
        case "restore": {
          dialog.innerHTML = '<h2 id="dialog-title">Gỡ mod?</h2><p>Xóa tệp map mod trong Resources để trò chơi sử dụng bản đồ mặc định. SkinChess vẫn được giữ nguyên. Hãy đóng trò chơi trước khi tiếp tục.</p><div class="dialog-actions">' +
            button("Hủy", "close", "secondary") + button("Gỡ mod", "confirm-restore") + '</div>';
          dialog.showModal();
          break;
        }
        case "confirm-restore":
          if (applying) break;
          applying = true;
          dialog.innerHTML = '<h2 id="dialog-title">Đang gỡ mod…</h2><p>Đang tải dữ liệu bản đồ mặc định…</p><progress aria-label="Đang khôi phục"></progress>';
          native.restore();
          break;
        case "close": app.pending = null; dialog.close(); break;
      }
    });
    dialog.addEventListener("cancel", event => {
      if (applying) event.preventDefault();
      else app.pending = null;
    });
    dialog.addEventListener('click', event => {
      if(!dialog.classList.contains('qr-dialog') || event.target!==dialog)return;
      const rect=dialog.getBoundingClientRect();
      if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
    });
    dialog.addEventListener("close", () => { delete dialog.dataset.awaiting; dialog.classList.remove('qr-dialog'); dialog.removeAttribute('aria-label'); dialog.setAttribute('aria-labelledby','dialog-title'); });
    window.senceBack = () => {
      if (dialog.open) {
        lastHomeBack = 0;
        if (!applying) {
          app.pending = null;
          dialog.close();
        }
        return true;
      }
      if (app.page === "home") {
        const now = Date.now();
        if (lastHomeBack && now - lastHomeBack < 2000) return false;
        lastHomeBack = now;
        native.backHint();
        return true;
      }
      lastHomeBack = 0;
      if (tabs.some(([page]) => page === app.page)) go("home");
      else back();
      return true;
    };
    let releaseUrl = "";
    let pendingUpdate = null;
    function showPendingUpdate() {
      if (!pendingUpdate || dialog.open || applying) return;
      const update = pendingUpdate;
      pendingUpdate = null;
      releaseUrl = update.url;
      dialog.innerHTML = '<h2 id="dialog-title">Có phiên bản mới</h2><p>' + escapeText(update.message) +
        ' Bạn có muốn cập nhật ngay?</p><div class="dialog-actions">' + button("Để sau", "close", "secondary") +
        button("Cập nhật", "release-download") + '</div>';
      dialog.showModal();
    }
    dialog.addEventListener("close", () => setTimeout(showPendingUpdate, 0));
    function showAdbPairing() {
      dialog.innerHTML = '<div class="memory-help-heading">' + symbol("wifi", "mint") +
        '<h2 id="dialog-title">ADB WiFi</h2></div><p>Ghép đôi bằng mã ngay trong SenceLab.</p>' +
        '<ol class="adb-steps"><li>Bấm Mở cài đặt.</li><li>Bật Tùy chọn nhà phát triển và Gỡ lỗi không dây.</li>' +
        '<li>Chọn Ghép nối thiết bị bằng mã và giữ cửa sổ này mở.</li><li>Nhập mã trên thông báo SenceLab.</li>' +
        '<li>Quay lại và bấm Bắt đầu.</li></ol>' +
        '<p id="adb-status" class="adb-status" role="status">Đang dò màn hình ghép đôi…</p>' +
        '<details><summary>Nhập mã trong ứng dụng</summary><p>Dùng chia đôi màn hình nếu cần giữ cửa sổ ghép nối mở.</p>' +
        '<label class="pass-label" for="adb-code">Mã ghép nối</label>' +
        '<input class="search" id="adb-code" inputmode="numeric" maxlength="6" autocomplete="off">' +
        '<label class="pass-label" for="adb-port">Cổng ghép đôi (khi không tự dò được)</label>' +
        '<input class="search" id="adb-port" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Số sau dấu : trên cửa sổ ghép nối">' +
        button("Ghép đôi", "adb-pair", "secondary full") +
        button("Cài đặt thông báo", "adb-notification-settings", "secondary full") + '</details>' +
        '<div class="dialog-actions">' + button("Mở cài đặt", "adb-settings", "secondary") +
        button("Bắt đầu", "adb-connect") + button("Hủy", "close", "secondary") + '</div>';
      dialog.showModal();
    }
    function refreshDrive() {
      if (driveLoading) return;
      driveLoading = true;
      driveStatus = "Đang tải danh mục Drive…";
      const hot = document.querySelector("#hot-results");
      if (hot) hot.innerHTML = hotRanking();
      native.loadDrive();
      native.refreshDownloads();
    }
    function updateHotRanking() {
      hotPacks = driveEntries
        .map(pack => ({ ...pack, downloads: onlineDownloads === null ? pack.downloads : onlineDownloads[pack.id] }))
        .filter(pack => Number.isSafeInteger(pack.downloads) && pack.downloads >= 0)
        .sort((a, b) => b.downloads - a.downloads || a.name.localeCompare(b.name, "vi")).slice(0, 5);
      const hot = document.querySelector("#hot-results");
      if (hot) hot.innerHTML = hotRanking();
    }
    function notice(title, message, action = "") {
      dialog.innerHTML = '<h2 id="dialog-title">' + escapeText(title) + '</h2><p>' + escapeText(message) +
        '</p><div class="dialog-actions">' + button("Đóng", "close", "secondary") +
        (action ? button(action === "fix-data-confirm" ? "Tiếp tục" : action === "debug-disable-confirm" ? "Tắt gỡ lỗi" : "Tải APK", action) : "") + '</div>';
      if (!dialog.open) dialog.showModal();
    }
    window.senceResult = (event, result) => {
      if(event==='import-applied'){ notice(result.error ? 'Chưa áp dụng được' : 'Đã áp dụng',result.message || result.error); return; }
      if (event === 'skin-remove') {
        if (!result.error) { app.skinActive = false; render(); }
        notice(result.error ? 'Chưa khôi phục được skin gốc' : 'Đã khôi phục skin gốc', result.message || result.error);
        if(result.needsOriginal) dialog.insertAdjacentHTML('beforeend',button('Fix Resources','fix-data','secondary full'));
        return;
      }
      if (event === 'debug-disabled') {
        notice(result.verified ? 'Đã tắt gỡ lỗi' : 'Chưa tắt hoàn tất', result.message || result.error || 'Chưa xác nhận được trạng thái gỡ lỗi.');
        native.checkMemory(); return;
      }
      if (typeof result.skinActive === "boolean") app.skinActive = result.skinActive;
      if (event === "zarchiver") { awaitingMemory = false; notice("ZArchiver", result.error || result.message); return; }
      if (event === "permissions-reset") {
        notice("Đặt lại quyền", result.message || result.error);
        native.checkMemory();
        return;
      }
      if (event === "auto-version") {
        if (result.url && !result.error) { pendingUpdate = result; showPendingUpdate(); }
        return;
      }
      if (event === "cache-size") { cacheBytes = result.bytes || 0; if (app.page === "settings") render(); return; }
      if (event === "operation-phase") {
        if (dialog.open && dialog.querySelector("progress")) {
          let label = dialog.querySelector("#file-download-progress p") || dialog.querySelector("p");
          if (label) label.textContent = result.message;
          dialog.querySelector("progress").removeAttribute("value");
        } return;
      }
      if (event === "file-progress") {
        if (!dialog.open || !dialog.querySelector('progress') && !dialog.textContent.includes("Đang tải và giải nén")) return;
        let meter = dialog.querySelector("#file-download-progress");
        if (!meter) {
          meter = document.createElement("div");
          meter.id = "file-download-progress";
          dialog.querySelectorAll("progress").forEach(bar => bar.remove());
          meter.setAttribute("role", "status");
          meter.innerHTML = '<p></p><progress max="100" style="width:100%"></progress>';
          dialog.append(meter);
        }
        const bar = meter.querySelector("progress");
        if (result.percent >= 0) bar.value = result.percent;
        else bar.removeAttribute("value");
        meter.querySelector("p").textContent = result.percent === 100 ? "Tải xong · đang xử lý và xác minh tệp…" : result.percent >= 0 ? "Đang tải " + result.percent + "%" : "Đã tải " + (result.bytes / 1048576).toFixed(1) + " MB";
        return;
      }
      if (event === "fix-folder") { notice("Quyền thư mục", result.message || result.error); return; }
      if (event === "fix-data") {
        if (!result.error) { app.pack = JSON.parse(native.active() || "null"); render(); }
        notice("Fix Resources", result.message || result.error || "Không sửa được dữ liệu.");
        if (result.needsFolder) dialog.insertAdjacentHTML("beforeend", button("Cấp quyền thư mục files", "fix-folder", "secondary full"));
        native.checkMemory();
        return;
      }
      if (event === "cache") {
        native.cacheSize();
        notice("Bộ nhớ đệm", result.message || result.error || "Không xóa được bộ nhớ đệm.");
        return;
      }
      if (event === "downloads") {
        if (result.ranking) {
          onlineDownloads = result.ranking;
          updateHotRanking();
        }
        return;
      }
      if (event === "adb") {
        const status = dialog.querySelector("#adb-status");
        if (dialog.open && status) status.textContent = result.message;
        if (result.message.includes("đã kết nối")) {
          if (dialog.open && status) dialog.close();
          native.checkMemory();
        }
        return;
      }
      if (event === "permission") {
        memoryStatus = result.message || result.error || "Chưa có quyền ghi.";
        if (result.shizuku && result.adb && result.saf) memoryDetails = result;
        if (awaitingMemory && result.selectedReady && result.selectedMethod === app.mode) {
          awaitingMemory = false;
          if (dialog.open) dialog.close();
          go("home");
          return;
        }
        if (dialog.open && dialog.dataset.awaiting === "permission") {
          delete dialog.dataset.awaiting;
          dialog.innerHTML = '<h2 id="dialog-title">Kiểm tra quyền</h2>' +
            (result.error ? '<p>' + escapeText(result.error) + '</p>' : permissionDetails()) +
            (result.canFix ? '<p>Đã kết nối nhưng chưa có quyền ghi. Bạn có thể thử Fix Resources sau khi đóng trò chơi.</p>' + button("Fix Resources", "fix-data", "secondary restore-button full") : "") +
            button("Đóng", "close", "primary full");
        }
        const home = document.querySelector("#home-permissions");
        if (home) home.innerHTML = homePermissions();
        else if (["permissions", "access", "settings"].includes(app.page)) render();
        return;
      }
      if (event === "map-state") {
        if (dialog.open && dialog.dataset.awaiting === "map-state") {
          delete dialog.dataset.awaiting;
          notice("Kiểm tra tệp đang dùng", result.message || result.error || "Chưa kiểm tra được tệp map.");
        }
        return;
      }
      if (event === "map-pass") {
        const input = dialog.querySelector("#map-pass");
        if (input && app.pending?.passId === result.id && result.pass) input.value = result.pass;
        return;
      }
      if (event === "apply" || event === "restore") {
        applying = false;
        if (result.cancelled) {
          if (dialog.open) dialog.close();
          return;
        }
      }
      if (event === "skins") {
        skinLoading = false;
        skinError = result.error || '';
        if (result.entries) { skinEntries = result.entries; }
        if (app.page === 'catalog' && catalogKind === 'Mod skin') document.querySelector('#drive-results').innerHTML = driveCatalog();
        return;
      }
      if (event === "drive") {
        driveLoading = false;
        driveStatus = result.error || "";
        if (result.entries) {
          driveEntries = result.entries;
        }
        if (app.page === "catalog") document.querySelector("#drive-results").innerHTML = driveCatalog();
        updateHotRanking();
        return;
      }
      if (result.error) {
        if (event === "apply" || event === "restore") {
          app.pack = JSON.parse(native.active() || "null");
          render();
        }
        if (event === "apply" && result.permissionAction) {
          notice("Quyền ghi tệp", result.error);
          dialog.insertAdjacentHTML("beforeend", button(result.permissionAction === "access" ? "Cấp quyền bộ nhớ" : result.permissionAction === "permission-check" ? "Kiểm tra quyền" : "Fix Resources", result.permissionAction, "secondary full"));
          native.checkMemory();
        } else if ((event === "restore") && memoryDetails?.canFix && /quyền ghi|chưa có quyền/i.test(result.error)) {
          notice("Chưa có quyền ghi", result.error + " Bạn có thể thử Fix Resources sau khi đóng trò chơi.");
          dialog.insertAdjacentHTML("beforeend", button("Fix Resources", "fix-data", "secondary restore-button full"));
        } else notice("Thao tác chưa hoàn tất", result.error);
        return;
      }
      if (event === "version") {
        releaseUrl = result.url || "";
        notice("Phiên bản ứng dụng", result.message, releaseUrl ? "release-download" : "");
        return;
      }
      if (event === "bundle-selected") {
        dialog.innerHTML = '<h2 id="dialog-title">Đặt tên tệp</h2><p>' + escapeText(result.name) +
          '</p><label class="pass-label" for="bundle-name">Tên hiển thị</label><input class="search" id="bundle-name" maxlength="80" value="' +
          escapeText(result.name.replace(/\.(assetbundle|zip)$/i, "").slice(0, 80)) + '">' +
          '<div class="dialog-actions">' + button("Hủy", "close", "secondary") + button("Lưu", "save-bundle") + '</div>';
        dialog.showModal();
        dialog.querySelector("#bundle-name").select();
        return;
      }
      if (event === "bundles") {
        app.bundles = result.entries;
        demoImports = app.bundles;
        if (dialog.open) dialog.close();
        app.feedback = result.message;
        if (app.page === "import") render();
        return;
      }
      if (event === "apply" || event === "restore") {
        app.pack = result.pack || null;
        const applied = result.applied || (event === 'apply' ? app.pack : null);
        if (event === "apply" && applied?.image) {
          const id = applied.id || applied.name;
          usedMaps = [{ id, name: applied.name, image: applied.image, category: applied.category, bundleId: applied.bundleId, passId: applied.passId }, ...usedMaps.filter(item => item.id !== id)].slice(0, 10);
          localStorage.setItem("sence.2.2.7.usedMaps", JSON.stringify(usedMaps));
        }
        if (dialog.open) dialog.close();
        go("home");
        app.feedback = result.message || (event === "apply" ? "Đã ghi và xác minh tệp đích." : "Đã xóa tệp map mod.");
        render();
        notice(event === 'apply' ? 'Đã áp dụng' : 'Đã gỡ mod', (result.message || 'Đã hoàn tất.') + (['Shizuku', 'ADB WiFi'].includes(result.accessMethod) ? ' Trước khi dùng ứng dụng ngân hàng, hãy dừng Shizuku và tắt Gỡ lỗi USB, Gỡ lỗi không dây, Tùy chọn nhà phát triển.' : ''));
      }
    };
    nav.innerHTML = tabs.map(([page, label, glyph]) =>
      '<button data-action="tab-' + page + '"><span>' + icon(glyph) + '</span><span>' + label + '</span></button>').join("");
    render();
    native.checkMemory();
    native.autoVersion();
    native.loadSkins();
    refreshDrive();
  </script>
</body>
</html>
