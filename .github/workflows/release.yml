name: Android release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check installed Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-source assembleDebug --no-daemon
      - run: cp android-source/app/build/outputs/apk/debug/app-debug.apk SenceLab-${{ github.ref_name }}.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "release-notes-${GITHUB_REF_NAME}.md" --latest
          fi
          gh release upload "$GITHUB_REF_NAME" "SenceLab-${GITHUB_REF_NAME}.apk" --clobber
