name: Android release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-source assembleDebug --no-daemon
      - run: cp android-source/app/build/outputs/apk/debug/app-debug.apk SenceLab-${{ github.ref_name }}.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "SenceLab-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --notes 'Cải thiện ghép đôi ADB WiFi và thông báo lỗi. Ghép đôi trên thiết bị thật cần được xác nhận.'
